name: Update activity chart

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 scripts/update_stats.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          git add assets README.md
          git diff --cached --quiet && exit 0
          git config user.name "Ritik Yadav"
          git config user.email "ritikyadav10032004@gmail.com"
          git commit -m "Update profile stats"
          git push
